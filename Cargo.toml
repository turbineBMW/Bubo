[package]
name = "bubo"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
gtk4 = { version = "0.11", features = ["v4_18"] }
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync"] }
async-channel = "2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
prost = "0.14"
prost-reflect = { version = "0.16", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
aes = "0.8"
ctr = "0.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
qrcode = { version = "0.14", default-features = false }
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes = "1"

[build-dependencies]
prost-build = "0.14"
prost-reflect-build = "0.16"
